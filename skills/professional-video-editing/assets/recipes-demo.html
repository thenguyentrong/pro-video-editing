<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Film recipes demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat-Variable.ttf") format("truetype"); font-weight: 100 900; }
      @font-face { font-family: "Bahnschrift"; src: url("assets/fonts/bahnschrift.ttf") format("truetype"); font-weight: 300 700; font-stretch: 75% 100%; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0b0c; color: #f4f3ef; font-family: "Montserrat", sans-serif; }
      .clip { position: absolute; inset: 0; overflow: hidden; }

      /* R1 film grade: one look for every shot */
      .shot { position: absolute; inset: 0; }
      .shot img, .shot video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; filter: contrast(1.06) saturate(0.86) sepia(0.08) brightness(0.96); }
      .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }

      /* R2 credit block (opening-credits language) */
      .credit { position: absolute; text-align: center; color: #f4f3ef; opacity: 0; text-shadow: 0 0 28px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.4); }
      .credit .role { font-weight: 400; font-size: 22px; letter-spacing: 0.32em; opacity: 0.82; }
      .credit .name { margin-top: 10px; font-weight: 400; font-size: 42px; letter-spacing: 0.2em; }

      /* R3 title card (trailer language) */
      .card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .card .t { font-family: "Bahnschrift", sans-serif; font-weight: 600; font-stretch: 75%; font-size: 120px; letter-spacing: 0.04em; text-transform: uppercase; color: #f4f3ef; opacity: 0; }

      /* R4 paper in light (documentary evidence) */
      .desk { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 45%, #2a2622 0%, #121110 70%, #0b0b0c 100%); }
      .stage3d { position: absolute; inset: 0; perspective: 1600px; }
      .paper { position: absolute; left: 204px; top: 368px; width: 1512px; height: 345px; box-shadow: 0 50px 90px rgba(0,0,0,0.55), 0 8px 18px rgba(0,0,0,0.35); }
      .paper img { position: absolute; inset: 0; width: 1512px; height: 345px; }
      .paper .base { filter: blur(3px) brightness(0.62) sepia(0.25); }
      .paper .sharp { -webkit-mask-image: linear-gradient(to bottom, transparent 39%, #000 42%, #000 61%, transparent 64%); mask-image: linear-gradient(to bottom, transparent 39%, #000 42%, #000 61%, transparent 64%); filter: sepia(0.18) contrast(1.04); }
      .paper .tint { position: absolute; inset: 0; background: #f2eee6; mix-blend-mode: multiply; opacity: 0.9; }
      .paper .tex { position: absolute; inset: 0; opacity: 0.35; mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3'/><feColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.5 0 0 0 0 0.45 0 0 0 0.9 0'/></filter><rect width='240' height='240' filter='url(%23p)'/></svg>"); }
      .paper .ul { position: absolute; left: 630px; top: 214px; width: 784px; height: 5px; background: #e8d9a8; }
      .src { position: absolute; left: 210px; top: 760px; font-family: "Montserrat", sans-serif; font-weight: 500; font-size: 20px; letter-spacing: 0.24em; color: rgba(244,243,239,0.7); opacity: 0; }

      /* R5 light sweep + pull-back (Apple language) */
      .sweep { position: absolute; inset: 0; background: linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,240,220,0.32) 50%, rgba(255,255,255,0) 62%); mix-blend-mode: screen; }
      .lock { position: absolute; left: 0; right: 0; top: 410px; text-align: center; opacity: 0; }
      .lock .eb { font-weight: 600; font-size: 28px; letter-spacing: 0.007em; color: #a7a9ad; }
      .lock .hd { margin-top: 14px; font-weight: 600; font-size: 80px; line-height: 1.05; letter-spacing: -0.015em; color: #f4f3ef; }

      /* R6 letterbox + grain on top of everything */
      .bar { position: absolute; left: 0; right: 0; height: 138px; background: #000; }
      #grain { position: absolute; left: -60px; top: -60px; width: 2040px; height: 1200px; opacity: 0.13; mix-blend-mode: overlay; pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>"); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <section id="a" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="a-shot" class="shot"><img src="assets/img/hq.jpg" alt="" /></div>
        <div class="vignette"></div>
        <div id="a-cr" class="credit" style="left: 1180px; top: 760px;"><div class="role">MADE IN</div><div class="name">HANGZHOU, CHINA</div></div>
      </section>
      <section id="b" class="clip" data-start="4" data-duration="2" data-track-index="1">
        <div class="card"><div id="b-t" class="t">They phone home.</div></div>
      </section>
      <section id="c" class="clip" data-start="6" data-duration="5" data-track-index="1">
        <div class="desk"></div>
        <div class="stage3d"><div id="c-pp" class="paper">
          <img class="base" src="assets/img/headline_crop.png" alt="" />
          <img class="sharp" src="assets/img/headline_crop.png" alt="" />
          <div class="tint"></div><div class="tex"></div>
          <div id="c-ul" class="ul"></div>
        </div></div>
        <div id="c-src" class="src">PUBLICATION, DATE</div>
      </section>
      <section id="d" class="clip" data-start="11" data-duration="5" data-track-index="1">
        <div id="d-shot" class="shot"><img src="assets/img/blackbox.jpg" alt="" /></div>
        <div class="vignette"></div>
        <div id="d-sw" class="sweep"></div>
        <div id="d-lk" class="lock"><div class="eb">Black box</div><div class="hd">Every move. On record.</div></div>
      </section>
      <section id="top" class="clip" data-start="0" data-duration="16" data-track-index="9">
        <div class="bar" style="top:0;"></div><div class="bar" style="bottom:0;"></div>
        <div id="grain"></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // R1 slow drift, no Ken Burns zoom-punch
      tl.fromTo("#a-shot", { scale: 1.05 }, { scale: 1.0, duration: 4, ease: "none" }, 0);
      // R2 credit: fade in 0.5, hold, fade out 0.4
      tl.fromTo("#a-cr", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.6);
      tl.to("#a-cr", { opacity: 0, duration: 0.4, ease: "power1.in" }, 3.4);
      // R3 title card: blur-in, hard cut out
      tl.fromTo("#b-t", { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 4.15);
      // R4 paper in light: tilt + slow push; underline draws while the camera settles
      tl.fromTo("#c-pp", { rotationX: 12, rotationY: -9, rotationZ: -1.2, scale: 0.98, transformOrigin: "50% 50%" }, { rotationX: 8, rotationY: -6, rotationZ: -0.6, scale: 1.06, duration: 5, ease: "none" }, 6);
      tl.fromTo("#c-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut", transformOrigin: "0% 50%" }, 7.2);
      tl.fromTo("#c-src", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.4);
      // R5 pull back + light sweep + lockup
      tl.fromTo("#d-shot", { scale: 1.6 }, { scale: 1.0, duration: 4, ease: "expo.out", transformOrigin: "55% 50%" }, 11);
      tl.fromTo("#d-sw", { xPercent: -120 }, { xPercent: 120, duration: 1.6, ease: "power2.inOut" }, 11.4);
      tl.fromTo("#d-lk", { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 13.2);
      // R6 grain moves every frame-ish
      tl.fromTo("#grain", { x: 0, y: 0 }, { x: -48, y: -40, duration: 16, ease: "steps(160)" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
